name: iroh_dart_example
description: Example app demonstrating the iroh_dart plugin (identity, connect/echo, watchAddr).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # The plugin lives one directory up (repo root == the iroh_dart package).
  iroh_dart:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Own dev-dependency now that the example resolves standalone (no shared workspace).
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
