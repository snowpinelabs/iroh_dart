# Version map for the iroh_dart monorepo (packages/iroh_quic and packages/iroh_flutter).
# It shows the libraries that the monorepo wraps and the tools that it pins.
# After you change a version, examine the wrapped API again.
# Then run the codegen again (packages/iroh_quic/tool/frb_codegen.sh).
# Then run packages/iroh_quic/tool/check.sh and packages/iroh_flutter/example/integration_test.

# The Rust P2P core that the packages wrap. The crate binds iroh directly, not the n0 `iroh-ffi` UniFFI library.
wraps:
  iroh:
    pub: "iroh_quic"
    crate: "iroh"
    repo: "n0-computer/iroh"
    version: "1.4.1"
    commit: "d6c6963b9602d1b8dd2ba53b6519e7eb19cc7940"
    note: "P2P QUIC core (edition 2024, MSRV 1.91). A new version can change names and APIs. Examine the API after each change."

  iroh-base:
    crate: "iroh-base"
    repo: "n0-computer/iroh"
    version: "1.4.1"
    commit: "d6c6963b9602d1b8dd2ba53b6519e7eb19cc7940"
    note: "Identity and address types (SecretKey, PublicKey, EndpointAddr, RelayUrl)."

# Codegen and native build tools that this repo pins.
tooling:
  flutter_rust_bridge:
    pub: "flutter_rust_bridge"
    cargo: "flutter_rust_bridge"
    repo: "fzyzcjy/flutter_rust_bridge"
    version: "2.13.0"
    note: "The codegen version and the runtime version must be the same. After a version change, run the codegen again."

  cryptography:
    pub: "cryptography"
    note: "Ed25519 signatures for the prebuilt libraries. bin/setup.dart verifies them and tool/sign_prebuilt.dart makes them (in iroh_quic)."

  cargokit:
    repo: "irondash/cargokit"
    vendored: "packages/iroh_flutter/cargokit"
    note: "Native build integration for the plugin (Gradle, CocoaPods, CMake). The repo keeps a vendored copy (git subtree)."

  melos:
    pub: "melos"
    version: "^8.9.0"
    note: "Monorepo task runner. Its configuration is under the `melos:` key in the root pubspec.yaml. There is no melos.yaml."

# Toolchain versions that the native library build requires.
toolchain:
  rust:
    version: "1.96.0"
    note: "packages/iroh_quic/rust/rust-toolchain.toml pins this version. iroh requires Rust 1.91 or later (edition 2024)."

  android-ndk:
    version: "29.0.14206865"
    note: "Google Play requires 16KB page alignment. Only NDK r28 and later give this alignment. packages/iroh_flutter/android/build.gradle pins this version."
