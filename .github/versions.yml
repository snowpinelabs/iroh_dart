# Version map for the iroh_dart monorepo (packages/iroh_quic + packages/iroh_flutter) -> the
# references it wraps and the tooling it pins. When one bumps, re-check the wrapped API surface,
# re-run codegen (packages/iroh_quic/tool/frb_codegen.sh), and re-verify
# (packages/iroh_quic/tool/check.sh + packages/iroh_flutter/example/integration_test).

# The Rust P2P core these packages wrap (bound directly; not n0's `iroh-ffi` UniFFI lib).
wraps:
  iroh:
    pub: "iroh_quic"
    crate: "iroh"
    repo: "n0-computer/iroh"
    version: "1.0.0"
    commit: "b4ec78e969c50ac17b5375348ee36e2df8ae4308"
    note: "P2P QUIC core (edition 2024, MSRV 1.91). A bump may rename nouns / move APIs => review."

  iroh-base:
    crate: "iroh-base"
    repo: "n0-computer/iroh"
    version: "1.0.0"
    commit: "b4ec78e969c50ac17b5375348ee36e2df8ae4308"
    note: "Identity & addressing types (SecretKey/PublicKey/EndpointAddr/RelayUrl)."

# Codegen / native-build tooling pinned by this repo.
tooling:
  flutter_rust_bridge:
    pub: "flutter_rust_bridge"
    cargo: "flutter_rust_bridge"
    repo: "fzyzcjy/flutter_rust_bridge"
    version: "2.12.0"
    note: "Codegen and runtime MUST be the SAME version; bumping requires re-running codegen."

  cryptography:
    pub: "cryptography"
    note: "Ed25519 verify/sign for the prebuilt pipeline (iroh_quic bin/setup.dart, tool/sign_prebuilt.dart)."

  cargokit:
    repo: "irondash/cargokit"
    vendored: "packages/iroh_flutter/cargokit"
    note: "Native-build glue for the Flutter plugin (Gradle/CocoaPods/CMake). Vendored via git subtree."

  melos:
    pub: "melos"
    version: "^8.0.0"
    note: "Monorepo task runner; config under the `melos:` key in the root pubspec (no melos.yaml)."

# Toolchain versions required to build the native library.
toolchain:
  rust:
    version: "1.96.0"
    note: "Pinned in packages/iroh_quic/rust/rust-toolchain.toml; iroh MSRV 1.91 / edition 2024."

  android-ndk:
    version: "29.0.14206865"
    note: "r28+ required for the 16KB page-alignment Google Play requirement."
