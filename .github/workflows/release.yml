name: release

# Runs on a version tag (e.g. `v1.0.0`): cross-compiles the native library for EVERY supported
# target, signs each, and uploads them to a GitHub release tagged `precompiled_<crateHash>` (cargokit
# precompiled-binaries mode) so consumers without a Rust toolchain download a signed binary instead
# of compiling. Then publishes the package to pub.dev and creates a human-facing GitHub Release for
# the tag with notes from CHANGELOG.md.
#
# Required secrets:
#   CARGOKIT_PRIVATE_KEY  - Ed25519 private key (hex) whose public half is in rust/cargokit.yaml.
#                           Generate with: cd cargokit/build_tool && dart run build_tool gen-key
#   (GITHUB_TOKEN is provided automatically; needs contents:write - set below.)
# pub.dev publishing uses OIDC: the `publish` job runs in the `pub.dev` GitHub Actions environment
# (configured under pub.dev's "Automated publishing"); no pub.dev token is stored in the repo.

on:
  push:
    # Semver version tags only (matches the tag pattern configured for pub.dev automated publishing).
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write   # create the precompiled_<hash> release + upload assets
  id-token: write   # pub.dev OIDC publishing

env:
  CARGO_TERM_COLOR: always
  CRATE_DIR: rust
  BUILD_TOOL_DIR: cargokit/build_tool
  REPO: snowpinelabs/iroh_dart

jobs:
  green-gate:
    name: tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cargo install flutter_rust_bridge_codegen --version '^2'
      - run: flutter pub get
      - run: ./tool/check.sh

  precompile-binaries:
    name: precompile ${{ matrix.name }}
    needs: green-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: apple
            os: macos-26
            rust_targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
            args: >-
              --target aarch64-apple-ios --target aarch64-apple-ios-sim --target x86_64-apple-ios
              --target aarch64-apple-darwin --target x86_64-apple-darwin
          - name: linux
            os: ubuntu-latest
            rust_targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
            # zigbuild (triggered by --glibc-version) gives a portable glibc floor for both arches.
            args: >-
              --target x86_64-unknown-linux-gnu --target aarch64-unknown-linux-gnu --glibc-version 2.17
          - name: windows
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --target aarch64-pc-windows-msvc
          - name: android
            os: ubuntu-latest
            rust_targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
            # android args are assembled in the step (needs the resolved SDK/NDK paths).
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: subosito/flutter-action@v2
        with: { channel: stable }

      # --- Linux: zig + cargo-zigbuild for a portable glibc build of both arches ---
      - if: matrix.name == 'linux'
        uses: mlugg/setup-zig@v2
        with: { version: 0.13.0 }
      - if: matrix.name == 'linux'
        run: cargo install cargo-zigbuild

      # --- Android: NDK r28+ (16KB page alignment) under the runner's Android SDK ---
      - if: matrix.name == 'android'
        name: Install Android NDK r28
        run: |
          set -e
          echo "ANDROID_NDK_VERSION=28.0.13004108" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108" >/dev/null

      - name: build_tool deps
        shell: bash
        working-directory: ${{ env.BUILD_TOOL_DIR }}
        run: dart pub get

      # --- Build + sign + upload all targets for this platform ---
      - name: precompile (non-android)
        if: matrix.name != 'android'
        shell: bash
        working-directory: ${{ env.BUILD_TOOL_DIR }}
        env:
          PRIVATE_KEY: ${{ secrets.CARGOKIT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dart run build_tool precompile-binaries -v \
            --repository "$REPO" \
            --manifest-dir ../../rust \
            ${{ matrix.args }}

      - name: precompile (android)
        if: matrix.name == 'android'
        shell: bash
        working-directory: ${{ env.BUILD_TOOL_DIR }}
        env:
          PRIVATE_KEY: ${{ secrets.CARGOKIT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dart run build_tool precompile-binaries -v \
            --repository "$REPO" \
            --manifest-dir ../../rust \
            --target aarch64-linux-android --target armv7-linux-androideabi \
            --target x86_64-linux-android --target i686-linux-android \
            --android-sdk-location "$ANDROID_HOME" \
            --android-ndk-version "$ANDROID_NDK_VERSION" \
            --android-min-sdk-version 24

  publish:
    name: publish to pub.dev
    needs: precompile-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # pub.dev's automated publishing requires the run to come from this GitHub Actions environment;
    # the OIDC id-token (granted at the workflow level) is exchanged for short-lived pub.dev creds,
    # so no pub.dev token is stored in the repo.
    environment: pub.dev
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - name: Publish
        run: flutter pub publish --force

  github-release:
    name: github release page
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub Release with notes from CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"       # e.g. v1.0.0
          version="${tag#v}"           # e.g. 1.0.0
          # Pull the "## <version>" section body from CHANGELOG.md (up to the next "## " heading).
          awk -v ver="## $version" '
            index($0, ver) == 1 { flag = 1; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $tag of iroh_dart." > notes.md
          echo "----- notes for $tag -----"; cat notes.md
          # Create the release page, or refresh its notes if it already exists (idempotent re-runs).
          # The cargokit binaries live on the precompiled_<hash> release and are not attached here.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" \
              --notes-file notes.md --verify-tag
          fi
