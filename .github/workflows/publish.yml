name: release

# This workflow runs on a version tag, for example `v1.0.0`. It has these jobs:
#   green-gate             - Runs the Rust tests and the pure-Dart package tests.
#   verify-xcframework     - Makes sure that the XCFramework release in Package.swift agrees with
#                            the tagged commit. The xcframework workflow made this release.
#   create-release         - Makes sure that the release for the tag exists. The release
#                            holds the prebuilt libraries.
#   prebuilt (matrix)      - Builds the native library for each desktop target and signs it with Ed25519.
#                            Then it attaches `irohdart_ffi-<target>.<ext>` and `.sig` to the release.
#                            Users of the pure-Dart package run `dart run iroh_quic:setup`.
#                            This command downloads a prebuilt library and verifies its signature.
#   publish-iroh-quic      - Publishes packages/iroh_quic to pub.dev with OIDC.
#                            It uses the reusable publish workflow of dart-lang/setup-dart.
#   verify-flutter-native-mirror - Stops the release if the mirror is not equal to
#                            packages/iroh_quic/rust (the output of tool/sync_native.sh).
#   wait-for-pub-dev-index - Waits so that pub.dev can index the new iroh_quic version.
#                            The plugin depends on that version.
#   publish-iroh-flutter   - Publishes packages/iroh_flutter to pub.dev in the same way.
#                            It starts after the mirror check and after the index wait.
#   github-release         - Writes the release notes from packages/iroh_quic/CHANGELOG.md.
#
# The workflow builds no prebuilt library for Android or iOS.
# On these platforms, the plugin uses cargokit to compile the crate during the app build.
# Exception: the Swift package of the plugin uses a prebuilt XCFramework for iOS and macOS.
# The xcframework workflow builds it before the tag, because the tagged commit must contain its
# checksum.
#
# Required secrets:
#   IROHDART_SIGNING_KEY - The Ed25519 signing key (hex).
#                          The public key is kPrebuiltPublicKeyHex in packages/iroh_quic/lib/src/ffi/prebuilt.dart.
#                          The key can be a cargokit private key (128 hex: seed and public key).
#                          The key can also be a 32-byte seed (64 hex) from packages/iroh_quic/tool/gen_key.dart.
#   GitHub gives GITHUB_TOKEN automatically. The token needs contents:write (see `permissions` below).
# Publication to pub.dev uses OIDC. The publish jobs run in the `pub.dev` GitHub Actions environment.
# On pub.dev, both packages must enable "Automated publishing" for this repo and tag pattern.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write   # Create the release and attach the prebuilt libraries.
  id-token: write   # Publish to pub.dev with OIDC.

env:
  CARGO_TERM_COLOR: always

jobs:
  green-gate:
    name: tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      # check.sh resolves the workspace, runs cargo build and cargo test, and runs dart analyze and dart test.
      - run: ./packages/iroh_quic/tool/check.sh

  # The Swift package downloads the XCFramework from the URL in Package.swift and compares the
  # archive with the checksum in Package.swift. This job does the same checks before publication.
  # It also makes sure that the framework comes from the crate source of the tagged commit.
  verify-xcframework:
    name: verify the XCFramework release of the Swift package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the XCFramework release with Package.swift and the crate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=packages/iroh_flutter/darwin/iroh_flutter/Package.swift
          version="$(sed -n 's/^version: //p' packages/iroh_flutter/pubspec.yaml)"
          manifest_version="$(sed -n 's/^let version = "\(.*\)"$/\1/p' "$manifest")"
          manifest_checksum="$(sed -n 's/^let checksum = "\(.*\)"$/\1/p' "$manifest")"
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::Package.swift has version $manifest_version, but pubspec.yaml has $version. Run the xcframework workflow."
            exit 1
          fi
          tag="xcframework-v$version"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir xcframework \
            --pattern irohdart_ffi.xcframework.zip --pattern source-tree.txt
          checksum="$(sha256sum xcframework/irohdart_ffi.xcframework.zip | cut -d ' ' -f 1)"
          if [ "$checksum" != "$manifest_checksum" ]; then
            echo "::error::The $tag archive has checksum $checksum, but Package.swift has $manifest_checksum. Run the xcframework workflow."
            exit 1
          fi
          tree="$(git rev-parse HEAD:packages/iroh_flutter/rust)"
          if [ "$(cat xcframework/source-tree.txt)" != "$tree" ]; then
            echo "::error::The $tag framework was not built from the crate of this commit. Run the xcframework workflow."
            exit 1
          fi

  create-release:
    name: ensure release exists
    needs: [green-gate, verify-xcframework]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" \
              --notes "Release $tag. Prebuilt native libraries are attached below." --verify-tag
          fi

  prebuilt:
    name: prebuilt ${{ matrix.name }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # `dart run iroh_quic:setup` downloads only the desktop native libraries.
          - name: macos
            os: macos-26
            ext: dylib
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - name: linux
            os: ubuntu-latest
            ext: so
            targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          - name: windows
            os: windows-latest
            ext: dll
            targets: x86_64-pc-windows-msvc aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.targets }}
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Resolve workspace (for the cryptography dep used by the signer)
        run: flutter pub get

      # Linux: zig and cargo-zigbuild set a minimum glibc version and compile for arm64.
      - if: matrix.name == 'linux'
        uses: mlugg/setup-zig@v2
        with: { version: 0.13.0 }
      - if: matrix.name == 'linux'
        run: cargo install cargo-zigbuild

      - name: Build, sign, and upload prebuilt libraries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IROHDART_SIGNING_KEY: ${{ secrets.IROHDART_SIGNING_KEY }}
          CRATE: packages/iroh_quic/rust
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          assets=()
          for t in ${{ matrix.targets }}; do
            echo "::group::build $t"
            if [ "${{ matrix.name }}" = "linux" ]; then
              # The `.2.17` suffix sets glibc 2.17 as the minimum version.
              # The output stays in target/$t/release.
              cargo zigbuild --release --manifest-path "$CRATE/Cargo.toml" --target "$t.2.17"
            else
              cargo build --release --manifest-path "$CRATE/Cargo.toml" --target "$t"
            fi
            echo "::endgroup::"
            case "${{ matrix.name }}" in
              macos)   src="$CRATE/target/$t/release/libirohdart_ffi.dylib" ;;
              linux)   src="$CRATE/target/$t/release/libirohdart_ffi.so" ;;
              windows) src="$CRATE/target/$t/release/irohdart_ffi.dll" ;;
            esac
            asset="irohdart_ffi-$t.${{ matrix.ext }}"
            cp "$src" "$asset"
            assets+=("$asset")
          done
          # Write a detached <asset>.sig file for each library.
          # Then attach each library and its signature to the release.
          dart run packages/iroh_quic/tool/sign_prebuilt.dart "${assets[@]}"
          uploads=()
          for a in "${assets[@]}"; do uploads+=("$a" "$a.sig"); done
          gh release upload "$tag" "${uploads[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # The reusable workflow of dart-lang/setup-dart gets the pub.dev OIDC token.
  # `flutter pub publish` and `dart pub publish` support only interactive Google sign-in.
  # CI cannot do an interactive sign-in.
  # A job that calls a reusable workflow cannot have its own steps.
  # Thus a different job (verify-flutter-native-mirror) examines the mirror.
  publish-iroh-quic:
    name: publish iroh_quic to pub.dev
    needs: prebuilt
    permissions:
      id-token: write   # OIDC authentication requires this permission.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1.8.1
    with:
      environment: pub.dev
      working-directory: packages/iroh_quic

  verify-flutter-native-mirror:
    name: verify iroh_flutter/rust mirror is in sync
    needs: prebuilt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tool/sync_native.sh
      - name: Fail if packages/iroh_flutter/rust is out of sync with packages/iroh_quic/rust
        run: git diff --exit-code -- packages/iroh_flutter/rust

  # pub.dev needs some time to index a new package version.
  # The plugin depends on the iroh_quic version that the job above published.
  # This job gives pub.dev time to index that version before the plugin publication.
  wait-for-pub-dev-index:
    name: wait for pub.dev to index iroh_quic
    needs: publish-iroh-quic
    runs-on: ubuntu-latest
    steps:
      - run: sleep 60

  publish-iroh-flutter:
    name: publish iroh_flutter to pub.dev
    needs: [wait-for-pub-dev-index, verify-flutter-native-mirror]
    permissions:
      id-token: write   # OIDC authentication requires this permission.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1.8.1
    with:
      environment: pub.dev
      working-directory: packages/iroh_flutter

  github-release:
    name: github release page
    needs: publish-iroh-flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub Release with notes from CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"       # Example: v1.0.0
          version="${tag#v}"           # Example: 1.0.0
          # Get the text of the "## <version>" section from the iroh_quic CHANGELOG.
          # The section stops at the next "## " heading.
          awk -v ver="## $version" '
            index($0, ver) == 1 { flag = 1; next }
            /^## / && flag { exit }
            flag { print }
          ' packages/iroh_quic/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $tag of iroh_quic + iroh_flutter." > notes.md
          echo "----- notes for $tag -----"; cat notes.md
          # Replace the notes of the release. The create-release job made this release.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" \
              --notes-file notes.md --verify-tag
          fi
