name: ci

# CI for the iroh_dart monorepo (packages/iroh_quic + packages/iroh_flutter).
# - green-gate: Rust + pure-Dart conformance tests for iroh_quic.
# - flutter-analyze: resolves the whole workspace and analyzes the Flutter plugin + example.
# - cross-compile: proves the owned `irohdart_ffi` crate builds for every native target family.
# The prebuilt-binary release + pub.dev publishing live in release.yml (runs on v* tags).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CRATE_DIR: packages/iroh_quic/rust

jobs:
  green-gate:
    name: tests (rust + dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      # iroh_quic is Flutter-free, but it shares a pub workspace with iroh_flutter, so resolving the
      # workspace needs Flutter (which bundles Dart). check.sh runs `flutter pub get` at the root,
      # then cargo build/test + `dart analyze`/`dart test` on the pure-Dart package.
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Run checks (cargo build/test + dart analyze/test)
        run: ./packages/iroh_quic/tool/check.sh

  flutter-analyze:
    name: flutter analyze (plugin + example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      # The plugin's vendored crate (packages/iroh_flutter/rust) is a committed mirror of
      # packages/iroh_quic/rust. Re-sync and fail if it drifted from the canonical source.
      - run: bash tool/sync_native.sh
      - name: Verify vendored crate is in sync
        run: |
          if ! git diff --quiet -- packages/iroh_flutter/rust; then
            echo "::error::packages/iroh_flutter/rust is stale. Run 'bash tool/sync_native.sh' and commit."
            git --no-pager diff --stat -- packages/iroh_flutter/rust
            exit 1
          fi
      - run: flutter pub get
      - run: dart analyze --fatal-infos packages/iroh_flutter
      - run: flutter analyze packages/iroh_flutter/example

  cross-compile:
    name: cross-compile ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: apple
            os: macos-26
            targets: aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin x86_64-apple-darwin
          - name: android
            os: ubuntu-latest
            targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          - name: linux
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
          - name: windows
            os: windows-latest
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/iroh_quic/rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.targets }}
      - name: Install cargo-ndk (android)
        if: matrix.name == 'android'
        run: cargo install cargo-ndk
      - name: Build (non-android)
        if: matrix.name != 'android'
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            echo "::group::$t"
            cargo build --release --target "$t"
            echo "::endgroup::"
          done
      - name: Build Android per-ABI (NDK r28+, cargo-ndk) + 16KB alignment check
        if: matrix.name == 'android'
        shell: bash
        run: |
          # NDK r28+ is required for the 16KB page-alignment Google Play requirement.
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ./jniLibs build --release
          # Verify 16KB-aligned LOAD segments on arm64.
          SO=$(find ./jniLibs/arm64-v8a -name 'libirohdart_ffi.so' | head -1)
          if command -v llvm-readelf >/dev/null; then READELF=llvm-readelf; else READELF=readelf; fi
          echo "Checking LOAD alignment of $SO"
          "$READELF" -l "$SO" | awk '/LOAD/ { print "align:", $NF }'
          # Fail if any LOAD segment is aligned below 2**14 (16KB).
          if "$READELF" -l "$SO" | grep -qE '0x(1000|2000|4000|8000)$' && \
             ! "$READELF" -l "$SO" | grep -qE '0x4000$|0x10000$'; then
            echo "::warning::verify 16KB alignment manually (NDK r28+ aligns to 0x4000)"
          fi
      - name: Upload native libs
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.name }}
          path: |
            packages/iroh_quic/rust/target/**/release/*.so
            packages/iroh_quic/rust/target/**/release/*.dylib
            packages/iroh_quic/rust/target/**/release/*.dll
            packages/iroh_quic/rust/jniLibs/**/*.so
          if-no-files-found: ignore
