# Dependabot updates the dependencies of the three ecosystems in this repo.
# Dependabot puts all updates for one ecosystem into one grouped PR. This keeps the reviews small.
# Dependabot ignores the intentional version pins. Other files use the same versions.
# Thus you must change these pins manually.
version: 2
updates:
  # The GitHub Actions in the ci and release workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    assignees: ["leonardocustodio"]
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # The action tag is the Rust version. It must agree with packages/iroh_quic/rust/rust-toolchain.toml.
      # Change the version in that file and in the workflows at the same time.
      - dependency-name: "dtolnay/rust-toolchain"

  # The Dart and Flutter packages in the workspace: the root (melos), the pure-Dart package,
  # the plugin, and the example app.
  - package-ecosystem: "pub"
    directories:
      - "/"
      - "/packages/iroh_quic"
      - "/packages/iroh_flutter"
      - "/packages/iroh_flutter/example"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    assignees: ["leonardocustodio"]
    groups:
      dart:
        patterns:
          - "*"
    ignore:
      # The FRB runtime version must be equal to the FRB codegen version.
      # Change it manually and run the codegen again. Do not let Dependabot change it.
      - dependency-name: "flutter_rust_bridge"

  # The crate: the FRB wrapper around iroh. The source copy is in the pure-Dart package.
  - package-ecosystem: "cargo"
    directory: "/packages/iroh_quic/rust"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    assignees: ["leonardocustodio"]
    groups:
      rust:
        patterns:
          - "*"
    ignore:
      # The Dart rule above applies here too. Cargo.toml pins the version with `=` (exact version).
      - dependency-name: "flutter_rust_bridge"
