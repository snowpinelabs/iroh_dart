# The pub workspace at the repo root and the Melos configuration.
# This file is not a package for publication. It connects the workspace members.
# One `dart pub get` or `flutter pub get` at the root resolves all members.
# The result is one pubspec.lock and one .dart_tool/package_config.json.
#
#   packages/iroh_quic    - The pure-Dart package (published): API, FFI loader, prebuilt library installer.
#   packages/iroh_flutter - The plugin (published): it builds the native library for each platform.
#
# The members refer to each other with a hosted version constraint (`iroh_quic: ^<version>`).
# In the workspace, the constraint resolves to the local copy. For other users, it resolves to pub.dev.
name: iroh_workspace
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - packages/iroh_quic
  - packages/iroh_flutter
  - packages/iroh_flutter/example

dev_dependencies:
  # Monorepo task runner for scripts and versions. Melos 7 and later use pub workspaces and no melos.yaml.
  melos: ^8.9.0

# Melos configuration. Melos 7 and later read it from the `melos:` key in this file.
melos:
  scripts:
    analyze:
      description: Analyze every package.
      exec:
        command: dart analyze --fatal-infos
        concurrency: 1
    test:
      description: Run tests in packages that have a test/ dir.
      exec:
        command: dart test
      packageFilters:
        dirExists: test
    # Copy the crate (packages/iroh_quic/rust) into the plugin. Then cargokit finds it at `../rust`.
    # Run this script after a change to the crate. Run it again before you publish the plugin.
    sync-native:
      description: Mirror the shared Rust crate into packages/iroh_flutter (cargokit needs it co-located).
      run: bash tool/sync_native.sh
  command:
    bootstrap:
      hooks:
        # Update the vendored crate after each bootstrap.
        post: bash tool/sync_native.sh
