// Android build for the plugin. cargokit uses the Android NDK to compile the crate `irohdart_ffi`
// (in ../rust) for each Android ABI. It puts the .so file for each Android ABI into jniLibs.
// Google Play requires 16 KB page alignment. This alignment is available in NDK r28 and later.
import groovy.json.JsonSlurper

group = "io.snowpine.iroh_flutter"
version = "1.0.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
    }
}

// The app project resolves the transitive dependencies of this plugin with ITS OWN repository
// list. Thus, this file adds the rustls-platform-verifier repository to all projects, the same as
// google() and mavenCentral(). A `repositories` block in this module is not sufficient.
// The closure below runs for each project, so this line finds the path one time only.
def rustlsPlatformVerifierRepo = findRustlsPlatformVerifierProject()

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url = rustlsPlatformVerifierRepo
            metadataSources.artifact()
        }
    }
}

apply plugin: "com.android.library"

android {
    namespace = "io.snowpine.iroh_flutter"
    compileSdk = 34
    ndkVersion = "29.0.14206865" // Google Play requires 16 KB page alignment (NDK r28 or later).

    defaultConfig {
        minSdk = 24
        // Native code finds the Kotlin classes of rustls-platform-verifier by name through JNI
        // only. Thus, R8 must keep these classes in release builds of the app.
        consumerProguardFiles "consumer-rules.pro"
    }
}

// Add the Rust build to the Android build. The path `../rust` is relative to android/.
// It points to the copy of the crate in the plugin.
apply from: "../cargokit/gradle/plugin.gradle"

cargokit {
    manifestDir = "../rust"
    libname = "irohdart_ffi"
}

// iroh checks TLS certificates through rustls-platform-verifier, for example for pkarr HTTPS
// publication and relay probes. At run time, rustls-platform-verifier needs a small Kotlin
// component in the app. The rustls-platform-verifier-android package contains the AAR for the
// same version. This function gives the path of that AAR as a local Maven repository.
// The upstream documentation shows this procedure
// (https://github.com/rustls/rustls-platform-verifier#android).
String findRustlsPlatformVerifierProject() {
    def cargoManifest = file("../rust/Cargo.toml").absolutePath
    def metadataText
    try {
        metadataText = providers.exec {
            commandLine("cargo", "metadata", "--format-version", "1",
                    "--filter-platform", "aarch64-linux-android",
                    "--manifest-path", cargoManifest)
        }.standardOutput.asText.get()
    } catch (Exception e) {
        throw new GradleException(
                "iroh_flutter: 'cargo metadata' failed - the Rust toolchain (cargo) must be on " +
                "PATH to build this plugin (cargokit needs it for the native build as well): " +
                e.message, e)
    }
    def metadata = new JsonSlurper().parseText(metadataText)
    def manifestPath = file(metadata.packages.find { it.name == "rustls-platform-verifier-android" }.manifest_path)
    return new File(manifestPath.parentFile, "maven").path
}

dependencies {
    implementation "rustls:rustls-platform-verifier:latest.release"
}
