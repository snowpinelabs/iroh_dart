# This file configures the analyzer. The analyzer does a static analysis of Dart code.
# It finds errors, warnings, and lint issues.
#
# Dart IDEs show the issues that the analyzer finds (https://dart.dev/tools#ides-and-editors).
# You can also start the analyzer from the command line with `flutter analyze`.

# The line below includes a set of recommended lints for Flutter apps, packages, and plugins.
# These lints help you write good code.
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 100

analyzer:
  # Build output and platform directories. Flutter 3.47 and later adds these directories on
  # `pub get` if they are not there.
  exclude:
    - "build/**"
    - "android/**"
    - "ios/**"
    - "macos/**"

linter:
  # Use the section below to change the lint rules of this project. You can disable rules from
  # `package:flutter_lints/flutter.yaml` (included above), or you can enable more rules.
  # https://dart.dev/lints lists all lints and their documentation.
  #
  # To disable a lint rule for one line or one Dart file only, do not use the section below.
  # Use the `// ignore: name_of_lint` or `// ignore_for_file: name_of_lint` syntax in that file.
  rules:
    # avoid_print: false  # Remove the first # to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Remove the first # to enable the `prefer_single_quotes` rule

# For more information about this file, see
# https://dart.dev/guides/language/analysis-options
