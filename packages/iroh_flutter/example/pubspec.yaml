name: iroh_flutter_example
description: Example app + on-device integration tests for the iroh_flutter plugin.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.27.0"

# Workspace member so `flutter pub get` at the repo root resolves it against the local plugin.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  iroh_flutter: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
