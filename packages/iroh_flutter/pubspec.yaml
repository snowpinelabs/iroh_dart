name: iroh_flutter
description: >-
  Flutter plugin for iroh 1.x: peer-to-peer QUIC networking on Android, iOS, macOS, Linux, and
  Windows. Builds the Rust core into your app.
version: 1.3.0
homepage: https://github.com/snowpinelabs/iroh_dart
repository: https://github.com/snowpinelabs/iroh_dart
issue_tracker: https://github.com/snowpinelabs/iroh_dart/issues
topics:
  - iroh
  - p2p
  - networking
  - quic
  - ffi

environment:
  sdk: ^3.12.0
  flutter: ">=3.27.0"

# This package is a member of the pub workspace at the repository root (see /pubspec.yaml).
# In the workspace, iroh_quic resolves to the local copy. Other apps receive the hosted version.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # iroh_quic contains the Dart API and the FFI loader. This plugin only adds the native build.
  # A hosted constraint (not a path dependency) keeps the published archive valid.
  # In the workspace, this constraint resolves to the local copy.
  iroh_quic: ^1.3.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    # This is an FFI plugin without Dart classes for each platform. cargokit adds the Rust build
    # to the native build of each platform. The iroh_quic loader finds the symbols through dart:ffi.
    #
    # Android is the only platform with a plugin class. iroh needs the JavaVM and the Android
    # Context of the app through JNI. It uses them to read the system DNS servers, list the network
    # interfaces, and check TLS certificates. IrohFlutterPlugin gives them to the native library
    # when the engine starts, before Dart can call the FFI. Without this Android bootstrap, a
    # release build stops with the error "android context was not initialized".
    # android/build.gradle adds the cargokit native build to the Android build.
    platforms:
      android:
        package: io.snowpine.iroh_flutter
        pluginClass: IrohFlutterPlugin
      # iOS and macOS share the darwin/ directory. It contains one podspec for CocoaPods and one
      # Swift package (darwin/iroh_flutter/Package.swift) for Swift Package Manager.
      ios:
        ffiPlugin: true
        sharedDarwinSource: true
      macos:
        ffiPlugin: true
        sharedDarwinSource: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
