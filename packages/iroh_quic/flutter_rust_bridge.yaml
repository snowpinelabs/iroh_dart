# Configuration for the flutter_rust_bridge (FRB) v2 code generator. `tool/frb_codegen.sh` runs it.
# The generator reads the `crate::api` module of the crate and writes the Dart bindings into the
# package.
rust_input: crate::api
rust_root: rust
dart_output: lib/src/rust
dart_root: .
dart_entrypoint_class_name: RustLib
# The generated Rust glue code goes next to the hand-written API modules.
rust_output: rust/src/frb_generated.rs
# This value is equal to the formatter width of the project: `formatter.page_width` in
# `analysis_options.yaml`. Thus the Dart bindings agree with `dart format`, and each generation
# gives the same output.
dart_format_line_length: 100
