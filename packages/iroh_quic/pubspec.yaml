name: iroh_quic
description: >-
  Pure-Dart binding for iroh 1.x: peer-to-peer QUIC networking with endpoints, connections,
  streams, and relays. Loads a prebuilt Rust core over dart:ffi.
version: 1.3.0
homepage: https://github.com/snowpinelabs/iroh_dart
repository: https://github.com/snowpinelabs/iroh_dart
issue_tracker: https://github.com/snowpinelabs/iroh_dart/issues
topics:
  - iroh
  - p2p
  - networking
  - quic
  - ffi

environment:
  sdk: ^3.12.0

# This package is a member of the pub workspace at the repository root (see /pubspec.yaml).
# All members share one dependency resolution and one lock file at the root.
resolution: workspace

dependencies:
  # Verifies the Ed25519 signature of the prebuilt library that `dart run iroh_quic:setup`
  # (bin/setup.dart) downloads. tool/sign_prebuilt.dart and tool/gen_key.dart also use it.
  cryptography: ^2.9.0
  # The Dart runtime of FRB. It is pure Dart and does not use Flutter.
  # The version MUST be equal to the FRB codegen version.
  flutter_rust_bridge: ^2.13.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
