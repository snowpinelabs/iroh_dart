# cargokit configuration for the irohdart_ffi crate.
#
# Precompiled-binaries mode: consumers WITHOUT a Rust toolchain automatically download a prebuilt,
# signed native library instead of compiling (cargokit's default is on when `rustup` is absent).
# Consumers WITH Rust build from source; either can override via a `cargokit_options.yaml`.
#
# The binaries are published by `.github/workflows/release.yml` (the `precompile-binaries` job) to a
# GitHub release tagged `precompiled_<crateHash>`, where crateHash covers src/*.rs + Cargo.toml +
# Cargo.lock + this file. Consumers fetch `<url_prefix><crateHash>/<target>_<lib>` and verify the
# Ed25519 signature against `public_key` before use.
precompiled_binaries:
  url_prefix: "https://github.com/snowpinelabs/iroh_dart/releases/download/precompiled_"
  # Public half of the signing key. The matching private key is the CI secret CARGOKIT_PRIVATE_KEY.
  # Regenerate with: (cd cargokit/build_tool && dart run build_tool gen-key)
  public_key: "74b7c73d253932835af9e3f63c99135e85aaff6a8ab2a7b0de0558a453246743"
