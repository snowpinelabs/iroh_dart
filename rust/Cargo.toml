[package]
# Lives at the package root in rust/ so the published package is self-contained and
# cargokit's manifestDir (../rust) resolves. Underscore (not kebab) so the package name matches the
# produced lib artifact (`libirohdart_ffi.a`/`.dylib`/`.so`) - cargokit looks artifacts up by the
# package name verbatim.
name = "irohdart_ffi"
version = "1.0.1"
edition = "2021"
publish = false
rust-version = "1.91"
description = "Owned flutter_rust_bridge wrapper crate exposing the iroh 1.0 P2P core to Dart (iroh_dart)."
license = "Apache-2.0"

[lib]
# staticlib -> Apple umbrella / process()-linking; cdylib -> Android/desktop DynamicLibrary.open.
crate-type = ["staticlib", "cdylib", "lib"]

[lints.rust]
# `frb_expand` is injected by the flutter_rust_bridge::frb attribute macro during codegen.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dependencies]
# Pin the FRB runtime EXACTLY to the codegen version (2.12.0) - they must match.
flutter_rust_bridge = "=2.12.0"
# Own the `iroh` crate directly. default-features = false drops `fast-apple-datapath`
# (private Apple API -> App Store risk) and `metrics`; `tls-ring` installs the rustls
# CryptoProvider so we never expose it to Dart.
iroh = { version = "1.0", default-features = false, features = ["tls-ring"] }
iroh-base = "1.0"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
# Stream bridging for Watcher / path_events / accept loop.
futures = "0.3"
# Custom AddressLookup returns an n0_future BoxStream of resolved Items; async-stream
# builds that 0-or-1-item stream ergonomically.
n0-future = "0.3"
async-stream = "0.3"
# Error plumbing (FRB surfaces anyhow::Error as a Dart exception) + canonical addr serialisation.
anyhow = "1"
postcard = { version = "1", features = ["use-std"] }
# Datagram payloads cross as bytes::Bytes (Connection::send_datagram/read_datagram).
bytes = "1"

# Dev/debug builds (used by `cargo test` and cargokit's Debug app builds) carry no debuginfo -
# the full iroh QUIC stack's debug symbols are multi-GB and aren't needed to pass tests or run the
# example. Keeps the simulator/emulator build disk-friendly.
[profile.dev]
debug = false
strip = "debuginfo"

[profile.release]
# Size-opt profile. NOTE: panic="abort" means a Rust panic aborts the process
# instead of being caught by FRB's catch_unwind -> surfaced as a Dart exception. We accept this
# for shipped release builds (size); `cargo test`/dev builds use the default `unwind` so the
# conformance tests still observe panics as catchable failures. Revisit if a panic-y
# code path (malformed peer input) needs graceful surfacing in production.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
